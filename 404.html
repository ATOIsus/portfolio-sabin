    <style>
      :root {
        --navy: #0e1a2e;
        --navy-2: #16253d;
        --text: #f3f6fa;
        --text-soft: #b9c7dd;
        --blue: #1b5fd1;
        --blue-light: #8db4ff;
        --fail: #ff8f8f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--navy);
        color: var(--text);
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
        line-height: 1.55;
      }
      .net-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        -webkit-mask-image: radial-gradient(ellipse 70% 80% at 85% 40%, #000 20%, transparent 85%);
        mask-image: radial-gradient(ellipse 70% 80% at 85% 40%, #000 20%, transparent 85%);
      }
      main {
        position: relative;
        z-index: 1;
        min-height: 100%;
        max-width: 620px;
        margin: 0 auto;
        padding: 48px 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .logo {
        display: inline-block;
        width: 84px;
      }
      .logo img {
        display: block;
      }
      .code {
        margin: 36px 0 8px;
        color: var(--blue-light);
        font-weight: 600;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        font-weight: 800;
      }
      .lead {
        margin: 20px 0 0;
        color: var(--text-soft);
        font-size: 1.1rem;
        max-width: 46ch;
      }
      .trace {
        margin: 32px 0 0;
        padding: 18px 20px;
        background: rgba(22, 37, 61, 0.85);
        border: 1px solid rgba(141, 180, 255, 0.18);
        border-radius: 6px;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 0.9rem;
        line-height: 1.8;
        color: var(--text-soft);
        overflow-x: auto;
        white-space: pre;
      }
      .trace .cmd {
        color: var(--text);
      }
      .trace .ok {
        color: var(--blue-light);
      }
      .trace .fail {
        color: var(--fail);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }
      .btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 4px;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 2px solid var(--blue);
      }
      .btn-solid {
        background: var(--blue);
        color: #fff;
      }
      .btn-solid:hover {
        background: #1449a6;
        border-color: #1449a6;
      }
      .btn-line {
        background: transparent;
        color: var(--text);
        border-color: rgba(141, 180, 255, 0.45);
      }
      .btn-line:hover {
        border-color: var(--blue-light);
      }
      .btn:focus-visible {
        outline: 3px solid var(--blue-light);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

    <script>
// Animated network topology for every <canvas class="net-bg">.
// data-variant="light" or "dark" picks the colours, data-seed fixes the layout.
(function () {
  var PALETTES = {
    light: {
      line: "rgba(27, 95, 209, 0.16)",
      node: "rgba(27, 95, 209, 0.42)",
      core: "#1b5fd1",
      packet: "#1b5fd1",
    },
    dark: {
      line: "rgba(141, 180, 255, 0.16)",
      node: "rgba(141, 180, 255, 0.5)",
      core: "#8db4ff",
      packet: "#d6e4ff",
    },
  };

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function seeded(seed) {
    var s = seed;
    return function () {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };

    var colors = PALETTES[canvas.dataset.variant] || PALETTES.light;
    var seed = parseInt(canvas.dataset.seed, 10) || 7;
    var w = 0, h = 0, nodes = [], edges = [], packets = [];
    var raf = null, onScreen = true, resizeTimer;

    function randomPacket(r) {
      r = r || Math.random;
      var e = edges[Math.floor(r() * edges.length)];
      return { e: e, t: r(), speed: 0.003 + r() * 0.005, from: r() < 0.5 ? e.a : e.b };
    }

      w = canvas.clientWidth;
      h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var spacing = w < 700 ? 88 : 118;
      nodes = [];
      for (var y = spacing / 2; y < h + spacing / 2; y += spacing) {
        for (var x = spacing / 2; x < w + spacing / 2; x += spacing) {
          if (r() < 0.32) continue;

            x: x + (r() - 0.5) * spacing * 0.75,
            y: y + (r() - 0.5) * spacing * 0.75,
            core: r() < 0.12,

        if (!next.length) return randomPacket();
        var e = next[Math.floor(Math.random() * next.length)];
        return { e: e, t: 0, speed: p.speed, from: at };
      });
      draw();
      raf = requestAnimationFrame(step);
    }

    function start() {
      if (!reduceMotion && onScreen && !document.hidden && raf === null) {
        raf = requestAnimationFrame(step);
      }
    }

    function stop() {
      if (raf !== null) cancelAnimationFrame(raf);
      raf = null;
    }

    build();
    draw();
    start();

    new ResizeObserver(function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        build();
        draw();
      }, 120);
    }).observe(canvas);

    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      onScreen ? start() : stop();
    }).observe(canvas);

    document.addEventListener("visibilitychange", function () {
      document.hidden ? stop() : start();
    });
  }

  document.querySelectorAll("canvas.net-bg").forEach(setup);

  var year = document.getElementById("year");
  if (year) year.textContent = new Date().getFullYear();
})();

    </script>
  </body>
